server:
  servlet:
    context-path: /auth-api

spring:
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        show_sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

userauth:
  jwt:
    secret: ${JWT_SECRET:dev-secret-please-change-this-to-a-very-long-secret-min-32-bytes}
    access-token-expiry: PT1H
    refresh-token-expiry: PT168H
    issuer: tracker-auth
  password:
    bcrypt-strength: 12
  login:
    max-failed-attempts: 5
    failed-attempts-window: PT30M
    lockout-duration: PT30M

logging:
  level:
    com.jjenus.tracker.userauth: INFO
    org.springframework.security: INFO
